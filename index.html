<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="envelope-container">
        <div class="envelope" id="envelope">
            <div class="envelope-front">
                <div class="stamp">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" fill="#FFE4B5" stroke="#D4A574" stroke-width="2"/>
                        <circle cx="30" cy="30" r="8" fill="#FFB6C1" opacity="0.6"/>
                        <circle cx="70" cy="30" r="8" fill="#F0E68C" opacity="0.6"/>
                        <circle cx="30" cy="70" r="8" fill="#9ACD32" opacity="0.6"/>
                        <circle cx="70" cy="70" r="8" fill="#808000" opacity="0.6"/>
                        <text x="50" y="50" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#666">♥</text>
                    </svg>
                </div>
            </div>
            <div class="envelope-back"></div>
            <div class="envelope-flap"></div>
            <div class="letter"></div>
        </div>
        <p class="hint">Click the stamp to open</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
